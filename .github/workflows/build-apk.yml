name: Build InstincT Recovery APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true

      - name: Prepare environment file
        run: |
          cp .env.example .env

      - name: Ensure firebase_options.dart exists
        run: |
          if [ ! -f lib/firebase_options.dart ]; then
            mkdir -p lib
            cat << 'EOF' > lib/firebase_options.dart
          // File generated by FlutterFire CLI (Dummy version).
          // ignore_for_file: type=lint
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart' show defaultTargetPlatform, TargetPlatform;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              switch (defaultTargetPlatform) {
                case TargetPlatform.android:
                  return android;
                default:
                  return android;
              }
            }
            static const FirebaseOptions android = FirebaseOptions(
              apiKey: 'AIzaSyAGX9snh746gJwQRIbvPlx5-XNeYgWSOmw',
              appId: '1:500936306874:android:89a22a1f2d36fed48b9283',
              messagingSenderId: '500936306874',
              projectId: 'portofliowebsite-387909',
            );
          }
          EOF
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          flutter build apk --debug --dart-define-from-file=.env

      - name: Rename APK for export
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/InstincT-Recovery.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstincT-Recovery-APK
          path: build/app/outputs/flutter-apk/InstincT-Recovery.apk
          retention-days: 14
