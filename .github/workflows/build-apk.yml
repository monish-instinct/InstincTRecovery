name: Build InstincT Recovery APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true

      - name: Prepare environment file
        run: |
          cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          flutter build apk --debug --dart-define-from-file=.env

      - name: Rename APK for export
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/InstincT-Recovery.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstincT-Recovery-APK
          path: build/app/outputs/flutter-apk/InstincT-Recovery.apk
          retention-days: 14
